<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrazione Firebase</title>
</head>
<body>
  <h2>Registrati</h2>
  <input type="email" id="regEmail" placeholder="Email">
  <input type="password" id="regPassword" placeholder="Password">
  <button onclick="register()">Registrati</button>

  <p>Hai già un account? <a href="login.html">Accedi</a></p>

  <!-- ✅ SDK Firebase compatibili -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCtrDYb1hYf1ymuLVOtOwQ2I0C__bvHhR4",
      authDomain: "headache-6994c.firebaseapp.com",
      projectId: "headache-6994c",
      storageBucket: "headache-6994c.firebasestorage.app",
      messagingSenderId: "942705950079",
      appId: "1:942705950079:web:7fd510025139d51d88ae4a",
      measurementId: "G-MXN2NJEYF6"
    };

    // Inizializza Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function register() {
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          alert("Registrazione avvenuta!");
          window.location.href = "login.html";  // Dopo la registrazione, redirigi alla pagina di login
        })
        .catch((error) => {
          alert("Errore: " + error.message);
        });
    }
  </script>
</body>
</html>
