<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Firebase</title>
</head>
<body>
  <h2>Registrati</h2>
  <input type="email" id="regEmail" placeholder="Email">
  <input type="password" id="regPassword" placeholder="Password">
  <button onclick="register()">Registrati</button>

  <h2>Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>

  <h2>Status</h2>
  <p id="status">Non loggato</p>
  <button onclick="logout()">Logout</button>

  <!-- ✅ SDK Firebase compatibili -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
   const firebaseConfig = {
    apiKey: "AIzaSyCtrDYb1hYf1ymuLVOtOwQ2I0C__bvHhR4",
    authDomain: "headache-6994c.firebaseapp.com",
    projectId: "headache-6994c",
    storageBucket: "headache-6994c.firebasestorage.app",
    messagingSenderId: "942705950079",
    appId: "1:942705950079:web:7fd510025139d51d88ae4a",
    measurementId: "G-MXN2NJEYF6"
  };

    // Inizializza Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    function register() {
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(userCredential => {
          alert("Registrazione avvenuta!");
        })
        .catch(error => {
          alert("Errore: " + error.message);
        });
    }

    function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          alert("Login riuscito!");
        })
        .catch(error => {
          alert("Errore: " + error.message);
        });
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById("status").innerText = "Non loggato";
      });
    }

    auth.onAuthStateChanged(user => {
      document.getElementById("status").innerText = user ? `Loggato come ${user.email}` : "Non loggato";
    });
  </script>
</body>
</html>
