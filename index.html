<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagina Iniziale</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .button {
      background-color: #4CAF50;
      color: white;
      padding: 15px 32px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px;
      width: 250px;
    }
    .button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Benvenuto!</h1>
    <p>Sei già registrato?</p>
    <button class="button" onclick="window.location.href='login.html'">Login</button>
    <p>Non sei ancora registrato?</p>
    <button class="button" onclick="window.location.href='register.html'">Registrati</button>
  </div>
</body>
</html>
