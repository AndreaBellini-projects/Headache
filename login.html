<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 5px;
      border: none;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    p {
      text-align: center;
      font-size: 14px;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Accedi</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Accedi</button>
    <p>Non hai un account? <a href="register.html">Registrati</a></p>
    <h2>Status</h2>
    <p id="status">Non loggato</p>
  </div>

  <!-- ✅ SDK Firebase versione 8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCtrDYb1hYf1ymuLVOtOwQ2I0C__bvHhR4",
      authDomain: "headache-6994c.firebaseapp.com",
      projectId: "headache-6994c",
      storageBucket: "headache-6994c.appspot.com",
      messagingSenderId: "942705950079",
      appId: "1:942705950079:web:7fd510025139d51d88ae4a",
      measurementId: "G-MXN2NJEYF6"
    };

    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();

    function login() {
      var email = document.getElementById("loginEmail").value;
      var password = document.getElementById("loginPassword").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          alert("Login riuscito!");
          document.getElementById("status").innerText = `Loggato come ${userCredential.user.email}`;
        })
        .catch(error => {
          alert("Errore: " + error.message);
        });
    }

    auth.onAuthStateChanged(user => {
      document.getElementById("status").innerText = user ? `Loggato come ${user.email}` : "Non loggato";
    });
  </script>
</body>
</html>
